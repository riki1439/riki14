<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagan - 世界遺産バガン</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; line-height: 1.6; color: #333; }
    header { background: #fff; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .logo { font-size: 1.5rem; font-weight: bold; color: #d35400; }
    nav a { margin-left: 20px; text-decoration: none; color: #555; font-weight: 500; }
    .hero { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/QiNLCXuLnyxnrInO.jpg') center/cover no-repeat; height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
    .hero h1 { font-size: 4rem; margin: 0; }
    .hero p { font-size: 1.5rem; }
    .section { padding: 4rem 10%; text-align: center; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-top: 2rem; }
    .card { background: #f9f9f9; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card h3 { padding: 1rem 1rem 0; }
    .card p { padding: 0 1rem 1rem; font-size: 0.9rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    footer { background: #333; color: #fff; text-align: center; padding: 2rem; margin-top: 2rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">BAGAN</div>
  <nav>
    <a href="#about">概要</a>
    <a href="#spots">観光地</a>
    <a href="#gallery">ギャラリー</a>
    <a href="#history">歴史</a>
  </nav>
</header>

<section class="hero">
  <h1>Bagan</h1>
  <p>世界遺産 バガン</p>
</section>

<section id="about" class="section">
  <h2>バガンとは</h2>
  <p>
    バガンはミャンマー中部に位置する古都で、11〜13世紀に栄えました。
    約2,000以上の寺院・仏塔が残る世界有数の遺跡です。
  </p>
</section>

<section id="spots" class="section">
  <h2>人気スポット</h2>
  <div class="cards">
    <div class="card">
      <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/QiNLCXuLnyxnrInO.jpg" alt="アーナンダ寺院">
      <h3>アーナンダ寺院</h3>
      <p>バガンを代表する美しい寺院です。</p>
    </div>
    <div class="card">
      <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/iKYDmEjlgufUHobD.jpg" alt="シュエズィーゴン・パゴダ">
      <h3>シュエズィーゴン・パゴダ</h3>
      <p>黄金に輝く有名なパゴダです。</p>
    </div>
    <div class="card">
      <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/dKVockOHcesYUbvb.jpg" alt="ダマヤンジー寺院">
      <h3>ダマヤンジー寺院</h3>
      <p>バガン最大規模の寺院です。</p>
    </div>
  </div>
</section>

<section id="gallery" class="section">
  <h2>ギャラリー</h2>
  <div class="gallery">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/UqWsnFyJwIsRHNsu.jpg" alt="Bagan View 1">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/CAmvPzyZJludVSmO.jpg" alt="Bagan View 2">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/xkHhfoCOjRlelouU.jpg" alt="Bagan View 3">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663635046627/QfMwIBnLoyTcCNMA.jpg" alt="Bagan View 4">
  </div>
</section>

<section id="history" class="section">
  <h2>歴史</h2>
  <p>
    11世紀から13世紀にかけてパガン王朝の首都として繁栄しました。
    現在では世界文化遺産として登録され、多くの観光客が訪れています。
  </p>
</section>

<footer>
  <p>Visit Bagan &copy; 2026</p>
</footer>

</body>
</html>
